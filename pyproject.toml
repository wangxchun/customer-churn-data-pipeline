[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-pipeline"
version = "0.1.0"
description = "Phase 1 data ingestion and storage pipeline for customer churn (learning project, local-only)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
churn-pipeline = "churn_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
