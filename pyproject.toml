[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-pipeline"
version = "0.1.0"
description = "Customer-churn learning project for MLA-C02, local only: Phase 1 ingestion and storage, Phase 2 features, Phase 3 model development, Phase 4 local release, batch inference and monitoring (no AWS deployment)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.2",  # Phase 2; set_output(transform="pandas") needs >= 1.2. Verified only with 1.9.1.
    "joblib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
churn-pipeline = "churn_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real_data: reads the real downloaded or processed data; excluded from the default CI (scripts/ci_check.sh) and run only with separate authorisation",
]
